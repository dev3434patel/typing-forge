name: SparowType checks
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck application, strict domains, and portable core
        run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run test:database
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm run test:content
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run check:bundle
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e -- --workers=1
        env:
          PLAYWRIGHT_BROWSERS: all
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --node-modules-dir=none --no-lock supabase/functions/submit-session/index.ts supabase/functions/race-operation/index.ts supabase/functions/delete-account/index.ts
